name: Netlink E2E

on:
  push:
    branches: [CJ-Netlink]
  workflow_dispatch:

concurrency:
  group: netlink-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  netlink-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld libarchive-dev wget
          pip3 install meson ninja

      - name: Build iSH command-line emulator
        run: |
          meson setup build -Dengine=asbestos -Dkernel=ish -Dlog=strace
          ninja -C build

      - name: Prepare Alpine x86 rootfs
        run: |
          wget -q https://dl-cdn.alpinelinux.org/alpine/v3.14/releases/x86/alpine-minirootfs-3.14.3-x86.tar.gz -O alpine.tar.gz
          ./build/tools/fakefsify alpine.tar.gz netlink-rootfs

      - name: Exercise virtual NETLINK_ROUTE
        timeout-minutes: 4
        run: |
          set -euo pipefail

          run_ip() {
            name="$1"
            shift
            echo "=== busybox ip $* ==="
            set +e
            timeout 20s ./build/ish -f netlink-rootfs /bin/busybox ip "$@" >"ip-$name.txt" 2>"ip-$name.strace"
            rc=$?
            set -e
            cat "ip-$name.txt" || true
            echo "--- last 250 strace lines ---"
            tail -n 250 "ip-$name.strace" || true
            if [ "$rc" -ne 0 ]; then
              echo "ip $* exited with status $rc"
              return "$rc"
            fi
          }

          run_ip addr addr
          run_ip link link
          run_ip route route
          run_ip addr-v6 -6 addr
          run_ip route-v6 -6 route
          run_ip route-get route get 1.1.1.1
          run_ip route-get-loopback route get 127.0.0.1
          run_ip route-get-v6-loopback -6 route get ::1

          # Guard the behavior that made the original tools usable, not just
          # their exit codes. Keep route-get permissive until its destination
          # attribute is made Linux-accurate in the implementation.
          grep -Eq '(^|[[:space:]])lo:' ip-addr.txt
          grep -Fq '127.0.0.1/8' ip-addr.txt
          grep -Eq '(^|[[:space:]])lo:' ip-link.txt
          test -s ip-route.txt
          grep -Eq 'dev [^ ]+' ip-route.txt
          grep -Eq '(^|[[:space:]])lo:' ip-addr-v6.txt
          grep -Fq '::1/128' ip-addr-v6.txt
          test -s ip-route-v6.txt
          grep -Eq 'dev [^ ]+' ip-route-v6.txt
          test -s ip-route-get.txt
          grep -Eq 'dev [^ ]+' ip-route-get.txt
          grep -Eq 'src [0-9a-fA-F:.]+' ip-route-get.txt
          test -s ip-route-get-loopback.txt
          grep -Fq 'dev lo' ip-route-get-loopback.txt
          grep -Fq 'src 127.0.0.1' ip-route-get-loopback.txt
          test -s ip-route-get-v6-loopback.txt
          grep -Fq 'dev lo' ip-route-get-v6-loopback.txt
          grep -Fq 'src ::1' ip-route-get-v6-loopback.txt

      - name: Install Nmap in guest
        timeout-minutes: 4
        run: |
          set -euxo pipefail
          grep -E '^nameserver' /etc/resolv.conf | head -1 | ./build/ish -f netlink-rootfs /bin/sed -n 'w /etc/resolv.conf'
          timeout 180s ./build/ish -f netlink-rootfs /sbin/apk add --no-cache nmap

      - name: Exercise Nmap TCP connect scan
        timeout-minutes: 2
        run: |
          set +e
          timeout 30s ./build/ish -f netlink-rootfs /usr/bin/nmap -sT -Pn -p 22,80,443 127.0.0.1 >nmap.txt 2>nmap.strace
          rc=$?
          set -e
          cat nmap.txt || true
          echo '--- last 300 Nmap stderr/strace lines ---'
          tail -n 300 nmap.strace || true
          if [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi
          grep -Fq 'Nmap scan report for localhost (127.0.0.1)' nmap.txt
          grep -Eq '^22/tcp[[:space:]]+open[[:space:]]+ssh$' nmap.txt
          grep -Eq '^80/tcp[[:space:]]+closed[[:space:]]+http$' nmap.txt
          grep -Eq '^443/tcp[[:space:]]+closed[[:space:]]+https$' nmap.txt
          grep -Fq 'Nmap done: 1 IP address (1 host up)' nmap.txt
