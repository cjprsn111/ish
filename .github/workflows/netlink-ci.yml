name: Netlink E2E

on:
  push:
    branches: [CJ-Netlink]
  workflow_dispatch:

concurrency:
  group: netlink-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  netlink-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld libarchive-dev wget
          pip3 install meson ninja

      - name: Build iSH command-line emulator
        run: |
          meson setup build -Dengine=asbestos -Dkernel=ish -Dlog=strace
          ninja -C build

      - name: Prepare Alpine x86 rootfs
        run: |
          wget -q https://dl-cdn.alpinelinux.org/alpine/v3.14/releases/x86/alpine-minirootfs-3.14.3-x86.tar.gz -O alpine.tar.gz
          ./build/tools/fakefsify alpine.tar.gz netlink-rootfs

      - name: Exercise virtual NETLINK_ROUTE
        timeout-minutes: 4
        run: |
          set -euo pipefail

          run_ip() {
            name="$1"
            shift
            echo "=== busybox ip $* ==="
            set +e
            timeout 20s ./build/ish -f netlink-rootfs /bin/busybox ip "$@" >"ip-$name.txt" 2>"ip-$name.strace"
            rc=$?
            set -e
            cat "ip-$name.txt" || true
            echo "--- last 250 strace lines ---"
            tail -n 250 "ip-$name.strace" || true
            if [ "$rc" -ne 0 ]; then
              echo "ip $* exited with status $rc"
              return "$rc"
            fi
          }

          run_ip addr addr
          run_ip addr-v4 -4 addr
          run_ip link link
          run_ip route route
          run_ip route-v4 -4 route
          run_ip addr-v6 -6 addr
          run_ip route-v6 -6 route
          run_ip route-get route get 1.1.1.1
          run_ip route-get-loopback route get 127.0.0.1
          run_ip route-get-v6-loopback -6 route get ::1

          grep -Eq '(^|[[:space:]])lo:' ip-addr.txt
          grep -Fq '127.0.0.1/8' ip-addr.txt
          grep -Fq '127.0.0.1/8' ip-addr-v4.txt
          if grep -Fq ' inet6 ' ip-addr-v4.txt; then
            echo 'FAIL: ip -4 addr includes IPv6 addresses'
            exit 1
          fi
          grep -Eq '(^|[[:space:]])lo:' ip-link.txt
          grep -Eq ' mtu [1-9][0-9]* ' ip-link.txt
          grep -Eq ' state (UP|DOWN|UNKNOWN)([[:space:]]|$)' ip-link.txt
          test -s ip-route.txt
          grep -Eq 'dev [^ ]+' ip-route.txt
          test -s ip-route-v4.txt
          grep -Eq 'dev [^ ]+' ip-route-v4.txt
          grep -Eq '^default([[:space:]]|$)' ip-route-v4.txt
          grep -Eq '(^|[[:space:]])lo:' ip-addr-v6.txt
          grep -Fq '::1/128' ip-addr-v6.txt
          if grep -Fq ' inet ' ip-addr-v6.txt; then
            echo 'FAIL: ip -6 addr includes IPv4 addresses'
            exit 1
          fi
          test -s ip-route-v6.txt
          grep -Eq 'dev [^ ]+' ip-route-v6.txt
          test -s ip-route-get.txt
          grep -Eq 'dev [^ ]+' ip-route-get.txt
          grep -Eq 'src [0-9a-fA-F:.]+' ip-route-get.txt
          test -s ip-route-get-loopback.txt
          grep -Fq 'dev lo' ip-route-get-loopback.txt
          grep -Fq 'src 127.0.0.1' ip-route-get-loopback.txt
          test -s ip-route-get-v6-loopback.txt
          grep -Fq 'dev lo' ip-route-get-v6-loopback.txt
          grep -Fq 'src ::1' ip-route-get-v6-loopback.txt

          echo '=== route lookup destination compatibility ==='
          for spec in 'ip-route-get.txt|1.1.1.1' 'ip-route-get-loopback.txt|127.0.0.1' 'ip-route-get-v6-loopback.txt|::1'; do
            file=${spec%%|*}
            dst=${spec#*|}
            awk -v dst="$dst" '$1 == dst { found=1 } END { exit !found }' "$file"
            echo "PASS: $file returns destination $dst"
          done

          echo '=== route family filtering compatibility ==='
          if grep -Eq '(^|[[:space:]])[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' ip-route-v6.txt; then
            echo 'FAIL: ip -6 route includes IPv4 routes'
            exit 1
          else
            echo 'PASS: ip -6 route contains no IPv4 routes'
          fi
          if grep -Eq '(^|[[:space:]])[0-9a-fA-F]*:[0-9a-fA-F:]+' ip-route-v4.txt; then
            echo 'FAIL: ip -4 route includes IPv6 routes'
            exit 1
          else
            echo 'PASS: ip -4 route contains no IPv6 routes'
          fi

          echo '=== interface ioctl compatibility ==='
          if grep -Fq 'ioctl 0x8942 failed' ip-*.strace; then
            echo 'FAIL: interface transmit-queue ioctl is not emulated'
            exit 1
          fi
          echo 'PASS: interface transmit-queue ioctl emits no compatibility warnings'

      - name: Exercise legacy interface ioctl consumers
        timeout-minutes: 1
        run: |
          set -euo pipefail

          timeout 20s ./build/ish -f netlink-rootfs /bin/busybox ifconfig -a \
            >ifconfig.txt 2>ifconfig.strace
          cat ifconfig.txt
          tail -n 200 ifconfig.strace || true

          grep -Eq '^lo([[:space:]]|:)' ifconfig.txt
          grep -Fq '127.0.0.1' ifconfig.txt
          if grep -Eqi 'ioctl.*failed|not supported' ifconfig.strace; then
            echo 'FAIL: BusyBox ifconfig hit an interface ioctl compatibility error'
            exit 1
          fi
          echo 'PASS: BusyBox ifconfig can enumerate/query host interfaces'

      - name: Stress repeated NETLINK_ROUTE requests
        timeout-minutes: 2
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            timeout 10s ./build/ish -f netlink-rootfs /bin/busybox ip link >/dev/null
            timeout 10s ./build/ish -f netlink-rootfs /bin/busybox ip addr >/dev/null
            timeout 10s ./build/ish -f netlink-rootfs /bin/busybox ip route >/dev/null
            timeout 10s ./build/ish -f netlink-rootfs /bin/busybox ip route get 127.0.0.1 >/dev/null
            timeout 10s ./build/ish -f netlink-rootfs /bin/busybox ip -6 route get ::1 >/dev/null
          done

      - name: Install network tools in guest
        timeout-minutes: 4
        run: |
          set -euxo pipefail
          grep -E '^nameserver' /etc/resolv.conf | head -1 | ./build/ish -f netlink-rootfs /bin/sed -n 'w /etc/resolv.conf'
          timeout 180s ./build/ish -f netlink-rootfs /sbin/apk add --no-cache nmap nmap-scripts iproute2

      - name: Exercise iproute2 NETLINK_ROUTE
        timeout-minutes: 2
        run: |
          set -euo pipefail

          timeout 20s ./build/ish -f netlink-rootfs /sbin/ip -V | tee iproute2-version.txt
          grep -Fq 'iproute2' iproute2-version.txt

          run_iproute2() {
            name="$1"
            shift
            echo "=== iproute2 ip $* ==="
            set +e
            timeout 20s ./build/ish -f netlink-rootfs /sbin/ip "$@" >"iproute2-$name.txt" 2>"iproute2-$name.strace"
            rc=$?
            set -e
            cat "iproute2-$name.txt" || true
            echo "--- last 300 stderr/strace lines ---"
            tail -n 300 "iproute2-$name.strace" || true
            if [ "$rc" -ne 0 ]; then
              echo "iproute2 ip $* exited with status $rc"
              return "$rc"
            fi
          }

          run_iproute2 addr addr
          run_iproute2 addr-v4 -4 addr
          run_iproute2 addr-v6 -6 addr
          run_iproute2 link link
          run_iproute2 link-stats -s link
          run_iproute2 neigh neigh
          run_iproute2 route route
          run_iproute2 route-v4 -4 route
          run_iproute2 route-v6 -6 route
          run_iproute2 get-public-v4 route get 1.1.1.1
          run_iproute2 get-v4 route get 127.0.0.1
          run_iproute2 get-v6 -6 route get ::1

          grep -Eq '(^|[[:space:]])lo:' iproute2-addr.txt
          grep -Fq '127.0.0.1/8' iproute2-addr.txt
          grep -Fq '127.0.0.1/8' iproute2-addr-v4.txt
          grep -Fq '::1/128' iproute2-addr-v6.txt
          if grep -Fq ' inet6 ' iproute2-addr-v4.txt; then
            echo 'FAIL: iproute2 -4 addr includes IPv6 addresses'
            exit 1
          fi
          if grep -Fq ' inet ' iproute2-addr-v6.txt; then
            echo 'FAIL: iproute2 -6 addr includes IPv4 addresses'
            exit 1
          fi
          echo 'PASS: address dumps honor requested IPv4/IPv6 family'
          grep -Eq '(^|[[:space:]])lo:' iproute2-link-stats.txt
          grep -Eq ' mtu [1-9][0-9]* ' iproute2-link-stats.txt
          grep -Eq ' state (UP|DOWN|UNKNOWN)([[:space:]]|$)' iproute2-link-stats.txt
          grep -Fq 'RX: bytes' iproute2-link-stats.txt
          grep -Fq 'TX: bytes' iproute2-link-stats.txt
          if grep -Eq '(^|[[:space:]])if[0-9]+:' iproute2-link-stats.txt; then
            echo 'FAIL: iproute2 -s link fell back to numeric interface names'
            exit 1
          fi
          echo 'PASS: iproute2 link statistics view completes with named interfaces'
          test -f iproute2-neigh.txt
          echo 'PASS: iproute2 neighbor-table dump completed'
          grep -Eq 'dev [^ ]+' iproute2-route.txt
          grep -Eq '^default([[:space:]]|$)' iproute2-route-v4.txt
          grep -Eq '^1\.1\.1\.1([[:space:]]|$)' iproute2-get-public-v4.txt
          grep -Eq 'dev [^ ]+' iproute2-get-public-v4.txt
          grep -Eq 'src [0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' iproute2-get-public-v4.txt
          grep -Fq '127.0.0.1' iproute2-get-v4.txt
          grep -Fq 'dev lo' iproute2-get-v4.txt
          grep -Fq '::1' iproute2-get-v6.txt
          grep -Fq 'dev lo' iproute2-get-v6.txt

          if grep -Eq '(^|[[:space:]])[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' iproute2-route-v6.txt; then
            echo 'FAIL: iproute2 -6 route includes IPv4 routes'
            exit 1
          fi
          if grep -Eq '(^|[[:space:]])[0-9a-fA-F]*:[0-9a-fA-F:]+' iproute2-route-v4.txt; then
            echo 'FAIL: iproute2 -4 route includes IPv6 routes'
            exit 1
          fi
          if grep -Eq ' dev if[0-9]+([[:space:]]|$)' iproute2-route*.txt iproute2-get-*.txt; then
            echo 'FAIL: iproute2 fell back to numeric interface names'
            exit 1
          fi
          echo 'PASS: iproute2 resolves route interface indexes to host names'

          echo '=== iproute2 Netlink error semantics ==='
          set +e
          timeout 20s ./build/ish -f netlink-rootfs /sbin/ip route add 198.51.100.0/24 dev lo \
            >iproute2-mutation.txt 2>iproute2-mutation.strace
          mutation_rc=$?
          set -e
          cat iproute2-mutation.txt || true
          tail -n 120 iproute2-mutation.strace || true
          if [ "$mutation_rc" -eq 0 ]; then
            echo 'FAIL: unsupported RTM_NEWROUTE mutation unexpectedly succeeded'
            exit 1
          fi
          if [ "$mutation_rc" -eq 124 ]; then
            echo 'FAIL: unsupported RTM_NEWROUTE mutation hung waiting for Netlink error'
            exit 1
          fi
          grep -Eqi 'operation not supported|not supported' iproute2-mutation.strace
          echo 'PASS: unsupported mutation returns a Linux-style Netlink protocol error'

          echo '=== additional rtnetlink mutation error coverage ==='
          check_unsupported_mutation() {
            name="$1"
            shift
            set +e
            timeout 20s ./build/ish -f netlink-rootfs /sbin/ip "$@" \
              >"iproute2-$name.txt" 2>"iproute2-$name.strace"
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              echo "FAIL: unsupported ip $* mutation unexpectedly succeeded"
              exit 1
            fi
            if [ "$rc" -eq 124 ]; then
              echo "FAIL: unsupported ip $* mutation hung waiting for Netlink error"
              exit 1
            fi
            grep -Eqi 'operation not supported|not supported' "iproute2-$name.strace"
            echo "PASS: ip $* returned EOPNOTSUPP without hanging"
          }
          check_unsupported_mutation route-del route del 198.51.100.0/24 dev lo
          check_unsupported_mutation addr-add addr add 198.51.100.1/32 dev lo
          check_unsupported_mutation addr-del addr del 198.51.100.1/32 dev lo

          echo 'PASS: full iproute2 NETLINK_ROUTE compatibility checks passed'

      - name: Stress repeated iproute2 NETLINK_ROUTE requests
        timeout-minutes: 2
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            timeout 10s ./build/ish -f netlink-rootfs /sbin/ip addr >/dev/null
            timeout 10s ./build/ish -f netlink-rootfs /sbin/ip link >/dev/null
            timeout 10s ./build/ish -f netlink-rootfs /sbin/ip neigh >/dev/null
            timeout 10s ./build/ish -f netlink-rootfs /sbin/ip -4 route >/dev/null
            timeout 10s ./build/ish -f netlink-rootfs /sbin/ip -6 route >/dev/null
            timeout 10s ./build/ish -f netlink-rootfs /sbin/ip route get 1.1.1.1 >/dev/null
            timeout 10s ./build/ish -f netlink-rootfs /sbin/ip -6 route get ::1 >/dev/null
          done

      - name: Exercise Nmap interface discovery and TCP connect scan
        timeout-minutes: 3
        run: |
          set -euo pipefail

          echo '=== Nmap interface and route discovery ==='
          set +e
          timeout 30s ./build/ish -f netlink-rootfs /usr/bin/nmap --iflist \
            >nmap-iflist.txt 2>nmap-iflist.strace
          iflist_rc=$?
          set -e
          cat nmap-iflist.txt || true
          echo '--- last 400 Nmap --iflist stderr/strace lines ---'
          tail -n 400 nmap-iflist.strace || true
          if [ "$iflist_rc" -ne 0 ]; then
            echo "FAIL: Nmap --iflist exited with status $iflist_rc"
            exit "$iflist_rc"
          fi
          grep -Fq 'lo' nmap-iflist.txt
          grep -Fq '127.0.0.1/8' nmap-iflist.txt
          grep -Fq '::1/128' nmap-iflist.txt
          if grep -Fq 'ROUTES: NONE FOUND(!)' nmap-iflist.txt; then
            echo 'FAIL: Nmap could enumerate interfaces but not connected routes'
            exit 1
          fi
          grep -Fq '127.0.0.0/8' nmap-iflist.txt
          grep -Eq '^0\.0\.0\.0/0[[:space:]]+[^[:space:]]+[[:space:]]+[0-9]+' nmap-iflist.txt
          echo 'PASS: Nmap sees the host-selected IPv4 default route'
          if grep -Eqi 'failed to open|cannot open|netlink.*error|socket_bindtodevice:' nmap-iflist.strace; then
            echo 'FAIL: Nmap interface discovery emitted a network compatibility error'
            exit 1
          fi
          echo 'PASS: Nmap discovers IPv4/IPv6 interfaces and connected routes'

          set +e
          timeout 30s ./build/ish -f netlink-rootfs /usr/bin/nmap -sT -Pn -p 22,80,443 127.0.0.1 >nmap.txt 2>nmap.strace
          rc=$?
          set -e
          cat nmap.txt || true
          echo '--- last 300 Nmap stderr/strace lines ---'
          tail -n 300 nmap.strace || true
          if [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi
          grep -Fq 'Nmap scan report for localhost (127.0.0.1)' nmap.txt
          grep -Eq '^22/tcp[[:space:]]+open[[:space:]]+ssh$' nmap.txt
          grep -Eq '^80/tcp[[:space:]]+closed[[:space:]]+http$' nmap.txt
          grep -Eq '^443/tcp[[:space:]]+closed[[:space:]]+https$' nmap.txt
          grep -Fq 'Nmap done: 1 IP address (1 host up)' nmap.txt

          echo '=== Nmap explicit interface binding compatibility ==='
          set +e
          timeout 30s ./build/ish -f netlink-rootfs /usr/bin/nmap -sT -Pn -n -e lo -p 22,80,443 127.0.0.1 \
            >nmap-bound.txt 2>nmap-bound.strace
          bound_rc=$?
          set -e
          cat nmap-bound.txt || true
          tail -n 200 nmap-bound.strace || true
          if [ "$bound_rc" -ne 0 ]; then
            echo "FAIL: explicitly bound Nmap scan exited with status $bound_rc"
            exit "$bound_rc"
          fi
          grep -Fq 'Nmap scan report for 127.0.0.1' nmap-bound.txt
          grep -Fq 'Nmap done: 1 IP address (1 host up)' nmap-bound.txt
          if grep -Fq 'socket_bindtodevice:' nmap-bound.strace; then
            echo 'FAIL: explicitly bound Nmap scan emitted an SO_BINDTODEVICE compatibility error'
            exit 1
          fi
          echo 'PASS: Nmap explicit interface binding completes without compatibility errors'

          echo '=== Nmap NSE/script-engine compatibility ==='
          timeout 20s ./build/ish -f netlink-rootfs /bin/sh -c 'test -f /usr/share/nmap/nse_main.lua'
          timeout 30s ./build/ish -f netlink-rootfs /usr/bin/nmap --script-help default             >nmap-nse-help.txt 2>nmap-nse-help.strace
          grep -Fq 'NSE:' nmap-nse-help.txt
          if grep -Eqi 'failed to initialize the script engine|could not locate nse_main.lua'               nmap-nse-help.txt nmap-nse-help.strace; then
            echo 'FAIL: Nmap NSE engine could not initialize'
            exit 1
          fi
          echo 'PASS: Nmap NSE engine initializes with the packaged script library'

      - name: Stress repeated Nmap TCP connect scans
        timeout-minutes: 3
        run: |
          set -euo pipefail
          for i in $(seq 1 5); do
            out="nmap-stress-$i.txt"
            timeout 30s ./build/ish -f netlink-rootfs /usr/bin/nmap -sT -Pn -n -p 22,80,443 127.0.0.1 >"$out" 2>/dev/null
            grep -Eq '^22/tcp[[:space:]]+open[[:space:]]+ssh$' "$out"
            grep -Eq '^80/tcp[[:space:]]+closed[[:space:]]+http$' "$out"
            grep -Eq '^443/tcp[[:space:]]+closed[[:space:]]+https$' "$out"
            grep -Fq 'Nmap done: 1 IP address (1 host up)' "$out"
          done
