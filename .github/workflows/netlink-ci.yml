name: Netlink E2E

on:
  push:
    branches: [CJ-Netlink]
  workflow_dispatch:

jobs:
  netlink-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld libarchive-dev wget
          pip3 install meson ninja

      - name: Build iSH command-line emulator
        run: |
          meson setup build -Dengine=asbestos -Dkernel=ish
          ninja -C build

      - name: Prepare Alpine x86 rootfs
        run: |
          wget -q https://dl-cdn.alpinelinux.org/alpine/v3.14/releases/x86/alpine-minirootfs-3.14.3-x86.tar.gz -O alpine.tar.gz
          ./build/tools/fakefsify alpine.tar.gz netlink-rootfs

      - name: Exercise virtual NETLINK_ROUTE
        run: |
          set -euxo pipefail
          ./build/ish -f netlink-rootfs /bin/busybox ip addr | tee ip-addr.txt
          ./build/ish -f netlink-rootfs /bin/busybox ip link | tee ip-link.txt
          ./build/ish -f netlink-rootfs /bin/busybox ip route | tee ip-route.txt
