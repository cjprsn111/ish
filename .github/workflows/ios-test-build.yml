name: CJ-Netlink iPhone Candidate

on:
  workflow_dispatch:
  push:
    branches: [CJ-Netlink]
    paths:
      - 'fs/sock.c'
      - 'fs/sock.h'
      - 'app/**'
      - 'iSH.xcodeproj/**'
      - '.github/workflows/ios-test-build.yml'

concurrency:
  group: cj-netlink-ios-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-unsigned-iphone-candidate:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install build dependencies
        run: |
          brew install llvm lld ninja libarchive meson

      - name: Build unsigned arm64 iPhone app
        run: |
          set -euo pipefail
          xcodebuild \
            -project iSH.xcodeproj \
            -scheme iSH \
            -configuration Debug \
            -arch arm64 \
            -sdk iphoneos \
            -derivedDataPath build-ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Validate unsigned arm64 bundle
        run: |
          set -euo pipefail
          APP="$(find build-ios/Build/Products -type d -name 'iSH.app' -print -quit)"
          test -n "$APP"
          test -d "$APP"

          MAIN="$APP/iSH"
          EXT="$APP/PlugIns/iSHFileProvider.appex/iSHFileProvider"
          test -f "$MAIN"
          test -f "$EXT"

          MAIN_ARCHS="$(xcrun lipo -archs "$MAIN")"
          EXT_ARCHS="$(xcrun lipo -archs "$EXT")"
          echo "iSH architectures: $MAIN_ARCHS"
          echo "File Provider architectures: $EXT_ARCHS"
          test "$MAIN_ARCHS" = "arm64"
          test "$EXT_ARCHS" = "arm64"

          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          echo "Bundle identifier: $BUNDLE_ID"
          test -n "$BUNDLE_ID"

          if codesign -dv "$APP" >/dev/null 2>&1; then
            echo 'FAIL: candidate unexpectedly contains a code signature'
            exit 1
          fi
          echo 'PASS: candidate is unsigned and ready for external signing/sideloading'

      - name: Package unsigned IPA candidate
        run: |
          set -euo pipefail
          APP="$(find build-ios/Build/Products -type d -name 'iSH.app' -print -quit)"
          test -n "$APP"
          test -d "$APP"
          echo "Packaging $APP"
          rm -rf Payload
          mkdir -p Payload
          ditto "$APP" Payload/iSH.app
          /usr/bin/zip -qry CJ-Netlink-iSH-unsigned.ipa Payload

          {
            echo "branch=CJ-Netlink"
            echo "commit=${GITHUB_SHA}"
            echo "build_type=unsigned iphoneos arm64"
            echo "main_architectures=$(xcrun lipo -archs "$APP/iSH")"
            echo "file_provider_architectures=$(xcrun lipo -archs "$APP/PlugIns/iSHFileProvider.appex/iSHFileProvider")"
            echo "bundle_identifier=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
            echo "signing_required_before_install=yes"
            xcodebuild -version | tr '\n' ' '
            echo
          } > CJ-Netlink-build-info.txt

          shasum -a 256 CJ-Netlink-iSH-unsigned.ipa | tee CJ-Netlink-iSH-unsigned.ipa.sha256
          unzip -t CJ-Netlink-iSH-unsigned.ipa

      - name: Upload iPhone candidate
        uses: actions/upload-artifact@v4
        with:
          name: CJ-Netlink-iPhone-Candidate-${{ github.sha }}
          path: |
            CJ-Netlink-iSH-unsigned.ipa
            CJ-Netlink-iSH-unsigned.ipa.sha256
            CJ-Netlink-build-info.txt
          if-no-files-found: error
          retention-days: 14
